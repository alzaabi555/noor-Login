<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e293b"><title>لا يوجد اتصال</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;font-family:Arial,sans-serif;color:#172033;padding:24px}.card{max-width:520px;text-align:center;background:#fff;padding:34px;border-radius:24px;box-shadow:0 18px 45px #0f172a18}.logo{width:130px}.btn{padding:13px 22px;border:0;border-radius:12px;background:#1e293b;color:#fff;font-weight:800}</style></head><body><main class="card"><img class="logo" src="./icon-192.png" alt="شعار نور"><h1>لا يوجد اتصال بالإنترنت</h1><p>يلزم الاتصال بالإنترنت للتحقق من بيانات ولي الأمر والطالب. لا يحتفظ التطبيق بأي بيانات شخصية للعمل دون اتصال.</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></main></body></html>
