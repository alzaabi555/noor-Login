<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>إدارة بوابة نور</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Tajawal,Arial,sans-serif;color:#172033}.wrap{width:min(920px,94%);margin:35px auto}.panel{background:#fff;padding:25px;border-radius:22px;box-shadow:0 15px 40px #0f172a12;margin-bottom:18px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:12px;font:inherit}button,.linkbtn{border:0;border-radius:12px;padding:13px 16px;background:#1e293b;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.blue{background:#4f46e5}.red{background:#be123c}.muted{color:#64748b}.hidden{display:none}.student{border:1px solid #e2e8f0;border-radius:15px;padding:16px;margin:12px 0}.student h3{margin:0 0 8px}.student .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.codebox{background:#fffbeb;border:2px solid #f59e0b;text-align:center;padding:22px;border-radius:18px}.code{font:900 36px monospace;letter-spacing:8px;direction:ltr}.error{color:#b91c1c;background:#fef2f2;padding:10px;border-radius:10px;margin:10px 0}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f8fafc;padding:12px 18px;border-radius:12px;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section id="loginPanel" class="panel"><h1>دخول مشرف النظام</h1><p class="muted">هذه الصفحة مخصصة للمشرف فقط. لا تُحفظ كلمة المرور في المتصفح.</p><form id="loginForm" class="grid"><input id="adminUser" autocomplete="username" placeholder="اسم المستخدم" required><input id="adminPass" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button class="blue">دخول آمن</button></form><div id="loginError"></div></section>
<section id="app" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1>لوحة إدارة رموز التحقق</h1><p class="muted">ابحث بالاسم أو آخر أربعة أرقام من الرقم المدني.</p></div><button id="logout" class="red">خروج</button></div><div id="stats" class="stats"></div></div><div class="panel"><form id="searchForm" class="grid"><input id="query" placeholder="اسم الطالب أو آخر 4 أرقام" required><button>بحث</button></form><div id="appError"></div><div id="results"></div></div></section>
<div id="modal" class="panel hidden codebox"><h2>تم إصدار رمز جديد</h2><p id="codeStudent"></p><div id="issuedCode" class="code"></div><p id="expiry"></p><p id="phone"></p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="copyCode" class="blue">نسخ الرمز</button><a id="whatsapp" class="linkbtn" target="_blank" rel="noopener noreferrer">فتح واتساب</a><button id="closeModal" class="red">إغلاق ومسح الرمز</button></div><p class="muted">الرمز يظهر مرة واحدة. إغلاق النافذة يمسحه من الواجهة.</p></div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxb7pGmD5oKpJ1i1YQ7086EmdIqIGs_sV3LN29TASwJVLZogaN9F_tkX0A7QK8cI0o/exec';let session='',issued='';const $=id=>document.getElementById(id);
async function api(body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const x=await r.json();if(x.status!=='success')throw new Error(x.message||'تعذر تنفيذ العملية.');return x}
function err(id,e){$(id).innerHTML='<div class="error">'+String(e.message||e).replace(/[<>&]/g,'')+'</div>'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').innerHTML='';try{const x=await api({action:'adminLogin',username:$('adminUser').value,password:$('adminPass').value});session=x.adminSession;$('adminPass').value='';$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');loadStats()}catch(ex){err('loginError',ex)}};
async function loadStats(){try{const x=await api({action:'adminStats',adminSession:session});$('stats').innerHTML='<div class="stat">إجمالي الطلاب: '+x.data.total+'</div><div class="stat">السجلات الفعالة: '+x.data.active+'</div><div class="stat">الرموز الفعالة: '+x.data.activeCodes+'</div>'}catch(ex){logoutLocal()}}
$('searchForm').onsubmit=async e=>{e.preventDefault();$('appError').innerHTML='';try{const x=await api({action:'adminSearch',adminSession:session,query:$('query').value});render(x.data)}catch(ex){err('appError',ex)}};
function render(rows){$('results').innerHTML='';if(!rows.length){$('results').textContent='لا توجد نتائج مطابقة.';return}rows.forEach(s=>{const d=document.createElement('div');d.className='student';const h=document.createElement('h3');h.textContent=s.studentName;const p=document.createElement('p');p.textContent='الرقم المدني: '+s.civilMasked+' | هاتف ولي الأمر: '+s.guardianPhoneMasked+' | حالة الرمز: '+s.codeStatus;const a=document.createElement('div');a.className='actions';const issue=document.createElement('button');issue.textContent='إصدار رمز جديد';issue.className='blue';issue.onclick=()=>issueCode(s.studentId);const revoke=document.createElement('button');revoke.textContent='إلغاء الرمز';revoke.className='red';revoke.onclick=()=>revokeCode(s.studentId);a.append(issue,revoke);d.append(h,p,a);$('results').append(d)})}
async function issueCode(studentId){if(!confirm('سيُلغى أي رمز سابق لهذا الطالب. متابعة؟'))return;try{const x=await api({action:'issueVerificationCode',adminSession:session,studentId});issued=x.data.code;$('codeStudent').textContent=x.data.studentName;$('issuedCode').textContent=issued;$('expiry').textContent='صالح حتى: '+new Date(x.data.expiresAt).toLocaleString('ar-OM');$('phone').textContent='رقم التسليم المعتمد: '+mask(x.data.guardianPhone);const phone=String(x.data.guardianPhone||'').replace(/\D/g,'');$('whatsapp').href='https://wa.me/'+phone+'?text='+encodeURIComponent('السلام عليكم،\nرمز التحقق الخاص ببوابة منصة نور هو: '+issued+'\nالرمز خاص بالطالب وولي أمره، ويرجى عدم مشاركته.');$('modal').classList.remove('hidden');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});loadStats()}catch(ex){err('appError',ex)}}
async function revokeCode(studentId){if(!confirm('هل تريد إلغاء الرمز الحالي؟'))return;try{await api({action:'revokeVerificationCode',adminSession:session,studentId});$('searchForm').requestSubmit();loadStats()}catch(ex){err('appError',ex)}}
function mask(v){v=String(v||'').replace(/\D/g,'');return v.length>2?'*'.repeat(Math.max(4,v.length-2))+v.slice(-2):'غير مسجل'}
$('copyCode').onclick=async()=>{await navigator.clipboard.writeText(issued);alert('تم نسخ الرمز')};$('closeModal').onclick=()=>{issued='';$('issuedCode').textContent='';$('modal').classList.add('hidden')};
async function logoutLocal(){if(session)try{await api({action:'adminLogout',adminSession:session})}catch(e){}session='';issued='';location.reload()}$('logout').onclick=logoutLocal;window.addEventListener('pagehide',()=>{session='';issued=''})
</script></body></html>
